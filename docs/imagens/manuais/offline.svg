<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6422B5"/></marker></defs><rect width="1100" height="550" rx="20" fill="#F4F1F8"/><g font-family="DejaVu Sans, sans-serif"><text x="30" y="43" font-size="27" fill="#28133F" font-weight="bold">Interpretar o resultado antes de repetir</text><text x="30" y="76" font-size="17" fill="#594965">A fila nativa depende de SQLCipher, sessão e validade local.</text><path d="M550 100L735 166L550 232L365 166Z" fill="#28133F"/><text x="434" y="163" font-size="22" fill="white" font-weight="bold">Envio confirmado?</text><text x="447" y="191" font-size="18" fill="white">Leia a resposta</text><path d="M550 232V252H190V280" fill="none" stroke="#6422B5" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="285" width="320" height="218" rx="16" fill="white" stroke="#D6C4E7"/><circle cx="58" cy="314" r="17" fill="#6422B5"/><text x="52" y="321" font-size="20" fill="white" font-weight="bold">1</text><text x="46" y="361" font-size="22" fill="#28133F" font-weight="bold">Sucesso</text><text x="46" y="423" font-size="18" fill="#594965">Confira o registro no</text><text x="46" y="448" font-size="18" fill="#594965">contexto e no filtro</text><text x="46" y="473" font-size="18" fill="#594965">corretos</text><path d="M550 232V252H550V280" fill="none" stroke="#6422B5" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="285" width="320" height="218" rx="16" fill="white" stroke="#D6C4E7"/><circle cx="418" cy="314" r="17" fill="#6422B5"/><text x="412" y="321" font-size="20" fill="white" font-weight="bold">2</text><text x="406" y="361" font-size="22" fill="#28133F" font-weight="bold">Sem transporte</text><text x="406" y="423" font-size="18" fill="#594965">Se elegível, a alteração</text><text x="406" y="448" font-size="18" fill="#594965">aguarda sincronização</text><path d="M550 232V252H910V280" fill="none" stroke="#6422B5" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="285" width="320" height="218" rx="16" fill="white" stroke="#D6C4E7"/><circle cx="778" cy="314" r="17" fill="#6422B5"/><text x="772" y="321" font-size="20" fill="white" font-weight="bold">3</text><text x="766" y="361" font-size="22" fill="#28133F" font-weight="bold">Recusa ou conflito</text><text x="766" y="423" font-size="18" fill="#594965">Reveja acesso ou compare</text><text x="766" y="448" font-size="18" fill="#594965">versões; não contorne</text><text x="30" y="535" font-size="14" fill="#594965">Diagrama didático • Edição 27/10/2026 • Sem dados reais</text></g></svg>