<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6422B5"/></marker></defs><rect width="1100" height="380" rx="20" fill="#F4F1F8"/><g font-family="DejaVu Sans, sans-serif"><text x="30" y="43" font-size="27" fill="#28133F" font-weight="bold">Preparar o aparelho da pessoa idosa</text><text x="30" y="76" font-size="17" fill="#594965">O QR é uma credencial temporária: não publique sua imagem.</text><rect x="30.0" y="105" width="320.0" height="230" rx="16" fill="white" stroke="#D6C4E7"/><circle cx="58.0" cy="134" r="17" fill="#6422B5"/><text x="52.0" y="141" font-size="20" fill="white" font-weight="bold">1</text><text x="46.0" y="181" font-size="22" fill="#28133F" font-weight="bold">Gerar</text><text x="46.0" y="243" font-size="18" fill="#594965">Adulto autorizado seleciona</text><text x="46.0" y="268" font-size="18" fill="#594965">a pessoa e prepara o QR</text><path d="M355.0 215H385.0" stroke="#6422B5" stroke-width="3" marker-end="url(#arrow)"/><rect x="390.0" y="105" width="320.0" height="230" rx="16" fill="white" stroke="#D6C4E7"/><circle cx="418.0" cy="134" r="17" fill="#6422B5"/><text x="412.0" y="141" font-size="20" fill="white" font-weight="bold">2</text><text x="406.0" y="181" font-size="22" fill="#28133F" font-weight="bold">Usar</text><text x="406.0" y="243" font-size="18" fill="#594965">Ler ou digitar em até 10</text><text x="406.0" y="268" font-size="18" fill="#594965">minutos; uso único</text><path d="M715.0 215H745.0" stroke="#6422B5" stroke-width="3" marker-end="url(#arrow)"/><rect x="750.0" y="105" width="320.0" height="230" rx="16" fill="white" stroke="#D6C4E7"/><circle cx="778.0" cy="134" r="17" fill="#6422B5"/><text x="772.0" y="141" font-size="20" fill="white" font-weight="bold">3</text><text x="766.0" y="181" font-size="22" fill="#28133F" font-weight="bold">Conferir</text><text x="766.0" y="243" font-size="18" fill="#594965">Verificar o nome, documentos</text><text x="766.0" y="268" font-size="18" fill="#594965">e navegação permitida</text><text x="30" y="365" font-size="14" fill="#594965">Diagrama didático • Edição 27/10/2026 • Sem dados reais</text></g></svg>