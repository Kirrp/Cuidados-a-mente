# Nome exibido nos logs e no contexto Spring.
spring.application.name=cuidados-a-mente
# Por padrão aceita conexões apenas da própria máquina. Em implantação, estas
# opções podem ser substituídas pelas variáveis entre ${...}.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
# Arquivo SQLite persistente e origens web autorizadas pelo CORS.
app.database=${DATABASE_PATH:./data/cuidados.db}
app.origins=${CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
# O TratadorErrosApi fornece mensagens controladas; detalhes internos não vazam.
server.error.include-message=never

app.email-key=${RESEND_API_KEY:}
app.email-from=${EMAIL_FROM:}
app.privacy-contact=${PRIVACY_CONTACT:}
app.media-path=${MEDIA_PATH:./data/media}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.mvc.log-request-details=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.ops-token=${OPS_TOKEN:}

# Prazo técnico revisável pelo responsável pela operação.
app.audit-days=${AUDIT_DAYS:365}
